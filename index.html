<script>
/* Phones and small tablets: the desktop at the screen's own width, zoom locked so the taskbar stays fixed at the
   bottom; html.mobile makes the contact list and every conversation fill the screen above it (js/app.js "mobile").
   The viewport tag is written here, before the page is laid out. */
(function () {
  var small = Math.min(screen.width, screen.height) < 820;
  if (small) document.documentElement.classList.add("mobile");
  document.write('<meta name="viewport" id="vp" content="width=device-width, initial-scale=1' + (small ? ', maximum-scale=1, user-scalable=no' : '') + '">');
})();
</script>
